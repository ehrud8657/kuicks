# 상시 운영 서버용 구성.
#
# 개발용(docker-compose.yml)과의 차이:
#   - Django 개발 서버 대신 gunicorn을 쓴다
#   - 소스를 볼륨으로 붙이지 않고 이미지에 구워 넣는다 (서버 폴더 상태와 무관하게 동일 동작)
#   - DEBUG를 끄고, 비밀값은 .env에서 주입한다
#   - restart 정책으로 서버 재부팅·크래시 후 자동 복구
#   - 컨테이너가 뜰 때 migrate와 collectstatic을 자동 실행한다
#
# 실행:  docker compose -f docker-compose.prod.yml up -d --build
# 중지:  docker compose -f docker-compose.prod.yml down
#        (-v 를 붙이면 DB 데이터까지 지워진다. 절대 습관적으로 쓰지 말 것)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuics}
      POSTGRES_USER: ${POSTGRES_USER:-kuics}
      # 값이 없으면 컨테이너를 아예 띄우지 않는다 (기본 비밀번호로 운영되는 사고 방지)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuics}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 외부로 포트를 열지 않는다. backend 컨테이너만 내부 네트워크로 접근한다.

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY를 .env에 설정하세요}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kuics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kuics}
      # 프론트가 nginx를 통해 같은 도메인에서 서빙되므로 그 주소를 적는다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      # 업로드 파일은 컨테이너를 새로 만들어도 남아야 한다.
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:

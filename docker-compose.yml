services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kuics
      POSTGRES_USER: kuics
      POSTGRES_PASSWORD: kuics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuics"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://kuics:kuics@db:5432/kuics
      # frontend가 nginx를 통해 같은 도메인(http://localhost)에서 서빙되므로
      # 브라우저가 보내는 Origin도 동일하다. 실제 배포 도메인이 정해지면 그 값으로 교체.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  postgres_data:


databases:
  - name: kuics-db
    databaseName: kuics
    user: kuics
    plan: free

services:
  - type: web
    name: kuics-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        fromDatabase:
          name: kuics-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # 반드시 Vercel 프론트 주소로 채워야 한다 (예: https://kuics.vercel.app).
      # Vercel rewrites로 프록시해도 브라우저가 보내는 Origin은 Vercel 도메인이라,
      # 이 값이 CSRF_TRUSTED_ORIGINS로 이어지지 않으면 로그인/비밀번호 변경이 막힌다.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # 프론트/백엔드를 서로 다른 도메인으로 직접 호출할 때만 true.
      # Vercel rewrites(같은 도메인) 방식이면 false로 둔다.
      - key: CROSS_SITE_COOKIES
        value: "false"

name: kuics_frontend
description: KUICS homepage Flutter Web frontend
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  file_picker: ^12.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.1
  http: ^1.2.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/LICENSE-Pretendard.txt
  # 한글 글꼴을 앱에 넣어 둔다. 넣지 않으면 Flutter 웹이 처음 보는 한글을 구글 글꼴 서버에서
  # 조각 단위로 받아오는 동안 글자가 잠깐 네모(☒)로 보인다. (SIL OFL 1.1, 라이선스 파일 동봉)
  # w600 이하 굵기는 가까운 Regular/Bold로 그려진다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800

